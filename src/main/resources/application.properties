server.port=${SERVER_PORT:8080}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/goldendrop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

#flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/001_Schema

#jwt Details
jwt.token.validity=180000
jwt.signing.key=${JWT_SECRET_KEY:signingkeytechbuddyofficialsigningkeytechbuddyofficial}
jwt.authorities.key=roles
jwt.cookie.name=X-AUTH


#AWS Configuration
cloud.aws.region.use-default-aws-region-chain=true
cloud.aws.stack.auto=false
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:${AWS_ACCESS_KEY:}}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:${AWS_SECRET_KEY:}}
cloud.aws.region.auto=false
cloud.aws.region.static=${AWS_REGION:ap-south-1}

#WhatsApp Configuration
notification.whatsapp.bearer-token=${WHATSAPP_BEARER_TOKEN:}
notification.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

